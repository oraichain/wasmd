syntax = "proto3";
package cosmwasm.txfees.v1;

import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/bank/v1beta1/bank.proto";
import "cosmwasm/txfees/v1/params.proto";

option go_package = "github.com/CosmWasm/wasmd/x/txfees/types";

// Msg defines the tokefactory module's gRPC message service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // Update module params
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  rpc AddFeeToken(MsgAddFeeToken) returns (MsgAddFeeTokenResponse);

  rpc RemoveFeeToken(MsgRemoveFeeToken) returns (MsgRemoveFeeTokenResponse);

  // AddBlacklist adds an account to the txfees blacklist.
  // Authority must be the foundation x/group policy account; execute via x/group
  // MsgSubmitProposal / MsgExec (not a CW3 contract path).
  rpc AddBlacklist(MsgAddBlacklist) returns (MsgAddBlacklistResponse);

  // RemoveBlacklist removes an account from the txfees blacklist.
  // Authority must be the foundation x/group policy account; execute via x/group
  // MsgSubmitProposal / MsgExec (not a CW3 contract path).
  rpc RemoveBlacklist(MsgRemoveBlacklist) returns (MsgRemoveBlacklistResponse);

  // RemoveBlacklistAndRecover removes an account from the txfees blacklist, then
  // transfers that account's spendable bank balances to to_address.
  // Authority must be the foundation x/group policy account; execute via x/group
  // MsgSubmitProposal / MsgExec (not a CW3 contract path).
  rpc RemoveBlacklistAndRecover(MsgRemoveBlacklistAndRecover) returns (MsgRemoveBlacklistAndRecoverResponse);
}

message MsgUpdateParams{
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority    = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  option (amino.name) = "cosmwasm/x/txfees/MsgUpdateParams";

  // params defines the x/fees parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message MsgUpdateParamsResponse {}

message MsgAddFeeToken{
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority    = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string denom = 2;
}

message MsgAddFeeTokenResponse {}

message MsgRemoveFeeToken{
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority    = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string denom = 2;
}

message MsgRemoveFeeTokenResponse {}

message MsgAddBlacklist {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "cosmwasm/x/txfees/MsgAddBlacklist";

  // authority must be the foundation x/group policy account address
  // (types.FoundationGroupPolicyAddress).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // address is the account to add to the blacklist.
  string address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgAddBlacklistResponse {}

message MsgRemoveBlacklist {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "cosmwasm/x/txfees/MsgRemoveBlacklist";

  // authority must be the foundation x/group policy account address
  // (types.FoundationGroupPolicyAddress).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // address is the account to remove from the blacklist.
  string address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgRemoveBlacklistResponse {}

message MsgRemoveBlacklistAndRecover {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "cosmwasm/x/txfees/MsgRemoveBlacklistAndRecover";

  // authority must be the foundation x/group policy account address
  // (types.FoundationGroupPolicyAddress).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // address is the currently blacklisted account to remove and recover from.
  string address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // to_address is the destination that receives recovered spendable balances.
  string to_address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgRemoveBlacklistAndRecoverResponse {
  // amounts are the coins transferred from address to to_address (may be empty).
  repeated cosmos.base.v1beta1.Coin amounts = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true
  ];
}